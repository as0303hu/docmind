[project]
name = "docmind"
version = "0.1.0"
description = "RAG-POWERED PDF Q&A API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "openai>=3.8.0",
    "pgvector>=0.5.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select =["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruf.lint.isort]
known-first-party = ["app"]

[tool.pyright]
pythonversion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini.options]
asyncio_mode = "auto"
testpaths = ["tests"]
